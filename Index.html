<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIFE:UP</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 40px;
    }

    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      margin: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>LIFE:UP</h1>

    <p class="subtitle">
      Každý den o krok výš.
    </p>

    <div class="card">
      <h2>Tvůj pokrok</h2>

      <div class="score" id="score">0</div>

      <p>UP bodů</p>
    </div>

    <div class="card">
      <h2>Dnešní krok</h2>

      <button onclick="addPoint()">
        + Přidat pokrok
      </button>
    </div>

  </div>

  <script>
    let score = 0;

    function addPoint() {
      score++;
      document.getElementById("score").textContent = score;
    }
  </script>

</body>
</html>
