
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PegasONE Human Index</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #b8c0d9;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .card {
      background: #151c32;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 30px;
      margin-top: 0;
    }

    p {
      color: #cbd2e8;
      line-height: 1.6;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      background: white;
      color: #0b1020;
    }

    button:active {
      transform: scale(0.97);
    }

    .features {
      margin-top: 30px;
      display: grid;
      gap: 12px;
    }

    .feature {
      background: #1d2640;
      padding: 14px;
      border-radius: 12px;
      color: #dce2f3;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">🪽 PegasONE</div>

    <div class="subtitle">
      Human Index
    </div>

    <section class="card">

      <h1>Poznej, co je v tobě.</h1>

      <p>
        Objev své silné stránky, schopnosti a potenciál.
        PegasONE tě nebude hodnotit jako člověka.
        Pomůže ti lépe pochopit, v čem můžeš růst.
      </p>

      <button onclick="startIndex()">
        ZAČÍT HUMAN INDEX
      </button>

      <div class="features">
        <div class="feature">🧠 Myšlení</div>
        <div class="feature">💡 Kreativita</div>
        <div class="feature">💪 Vytrvalost</div>
        <div class="feature">🌱 Potenciál růstu</div>
      </div>

    </section>

  </main>

<script>
  function startIndex() {
    const card = document.querySelector(".card");

    card.innerHTML = `
      <h1>Otázka 1</h1>

      <p>
        Když narazíš na problém, který neznáš,
        co uděláš jako první?
      </p>

      <button onclick="answer(1)">
        A — Vzdám to
      </button>

      <button onclick="answer(2)">
        B — Najdu návod
      </button>

      <button onclick="answer(3)">
        C — Požádám někoho o pomoc
      </button>

      <button onclick="answer(4)">
        D — Zkusím vlastní řešení
      </button>

      <button onclick="answer(5)">
        E — Zkusím několik různých řešení
      </button>
    `;
  }

  function answer(value) {
    alert("Tvoje odpověď: " + value);
  }
      </script>
</body>
</html>
