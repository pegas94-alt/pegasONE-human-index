
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PegasONE Human Index</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #b8c0d9;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .card {
      background: #151c32;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 30px;
      margin-top: 0;
    }

    p {
      color: #cbd2e8;
      line-height: 1.6;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      background: white;
      color: #0b1020;
    }

    button:active {
      transform: scale(0.97);
    }

    .features {
      margin-top: 30px;
      display: grid;
      gap: 12px;
    }

    .feature {
      background: #1d2640;
      padding: 14px;
      border-radius: 12px;
      color: #dce2f3;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">🪽 PegasONE</div>

    <div class="subtitle">
      Human Index
    </div>

    <section class="card">

      <h1>Poznej, co je v tobě.</h1>

      <p>
        Objev své silné stránky, schopnosti a potenciál.
        PegasONE tě nebude hodnotit jako člověka.
        Pomůže ti lépe pochopit, v čem můžeš růst.
      </p>

      <button onclick="startIndex()">
        ZAČÍT HUMAN INDEX
      </button>

      <div class="features">
        <div class="feature">🧠 Myšlení</div>
        <div class="feature">💡 Kreativita</div>
        <div class="feature">💪 Vytrvalost</div>
        <div class="feature">🌱 Potenciál růstu</div>
      </div>

    </section>

  </main>

<script>
  let answers = [];

  const questions = [
    {
      text: "Když narazíš na problém, který neznáš, co uděláš jako první?",
      options: [
        "Vzdám to.",
        "Najdu návod.",
        "Požádám někoho o pomoc.",
        "Zkusím vlastní řešení.",
        "Zkusím několik různých řešení."
      ]
    },
    {
      text: "Když dostaneš úkol bez přesného návodu, co uděláš?",
      options: [
        "Nevím, kde začít.",
        "Počkám, až mi někdo poradí.",
        "Najdu si informace.",
        "Vymyslím vlastní postup.",
        "Vymyslím několik možných postupů a vyberu nejlepší."
      ]
    }
  ];

  let currentQuestion = 0;

  function startIndex() {
    showQuestion();
  }

  function showQuestion() {
    const question = questions[currentQuestion];
    const card = document.querySelector(".card");

    let buttons = "";

    question.options.forEach((option, index) => {
      buttons += `
        <button onclick="answer(${index + 1})">
          ${option}
        </button>
      `;
    });

    card.innerHTML = `
      <h1>Otázka ${currentQuestion + 1} / ${questions.length}</h1>

      <p>${question.text}</p>

      ${buttons}
    `;
  }

  function answer(value) {
    answers.push(value);

    currentQuestion++;

    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    const card = document.querySelector(".card");

    const total =
      answers.reduce((sum, value) => sum + value, 0);

    const average =
      Math.round((total / answers.length) * 20);

    card.innerHTML = `
      <h1>První část dokončena 🪽</h1>

      <p>
        Tvoje první skóre Human Indexu:
      </p>

      <h1>${average} / 100</h1>

      <p>
        Toto zatím není hodnocení člověka.
        Je to pouze první experimentální výsledek.
      </p>

      <button onclick="location.reload()">
        ZAČÍT ZNOVU
      </button>
    `;
  }
      </script>
</body>
</html>
