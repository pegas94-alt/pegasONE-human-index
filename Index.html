
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PegasONE Human Index</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #b8c0d9;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .card {
      background: #151c32;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 30px;
      margin-top: 0;
    }

    p {
      color: #cbd2e8;
      line-height: 1.6;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      background: white;
      color: #0b1020;
    }

    button:active {
      transform: scale(0.97);
    }

    .features {
      margin-top: 30px;
      display: grid;
      gap: 12px;
    }

    .feature {
      background: #1d2640;
      padding: 14px;
      border-radius: 12px;
      color: #dce2f3;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">🪽 PegasONE</div>

    <div class="subtitle">
      Human Index
    </div>

    <section class="card">

      <h1>Poznej, co je v tobě.</h1>

      <p>
        Objev své silné stránky, schopnosti a potenciál.
        PegasONE tě nebude hodnotit jako člověka.
        Pomůže ti lépe pochopit, v čem můžeš růst.
      </p>

      <button onclick="startIndex()">
        ZAČÍT HUMAN INDEX
      </button>

      <div class="features">
        <div class="feature">🧠 Myšlení</div>
        <div class="feature">💡 Kreativita</div>
        <div class="feature">💪 Vytrvalost</div>
        <div class="feature">🌱 Potenciál růstu</div>
      </div>

    </section>

  </main>

<script>
  let answers = [];

  const questions = [
    {
      text: "Když narazíš na problém, který neznáš, co uděláš jako první?",
      options: [
        "Vzdám to.",
        "Najdu návod.",
        "Požádám někoho o pomoc.",
        "Zkusím vlastní řešení.",
        "Zkusím několik různých řešení."
      ]
    },
    {
      text: "Když dostaneš úkol bez přesného návodu, co uděláš?",
      options: [
        "Nevím, kde začít.",
        "Počkám, až mi někdo poradí.",
        "Najdu si informace.",
        "Vymyslím vlastní postup.",
        "Vymyslím několik možných postupů a vyberu nejlepší."
      ]
    }
  ];

  let currentQuestion = 0;

  function startIndex() {
    showQuestion();
  }

  function showQuestion() {
    const question = questions[const questions = [
  {
    text: "Když narazíš na problém, který neznáš, co uděláš jako první?",
    options: [
      { text: "Vzdám to.", scores: { thinking: 0 } },
      { text: "Najdu návod.", scores: { thinking: 2, growth: 2 } },
      { text: "Požádám někoho o pomoc.", scores: { teamwork: 3, growth: 2 } },
      { text: "Zkusím vlastní řešení.", scores: { thinking: 3, creativity: 3, practicality: 2 } },
      { text: "Zkusím několik různých řešení.", scores: { thinking: 4, creativity: 4, practicality: 3, growth: 2 } }
    ]
  },

  {
    text: "Když dostaneš úkol bez přesného návodu, co uděláš?",
    options: [
      { text: "Nevím, kde začít.", scores: { thinking: 0 } },
      { text: "Počkám, až mi někdo poradí.", scores: { teamwork: 2 } },
      { text: "Najdu si informace.", scores: { thinking: 3, growth: 3 } },
      { text: "Vymyslím vlastní postup.", scores: { creativity: 3, practicality: 3 } },
      { text: "Vymyslím několik postupů a vyberu nejlepší.", scores: { thinking: 4, creativity: 4, practicality: 4 } }
    ]
  },

  {
    text: "Když se ti něco několikrát nepovede, co uděláš?",
    options: [
      { text: "Přestanu.", scores: { persistence: 0 } },
      { text: "Dám si pauzu.", scores: { growth: 1 } },
      { text: "Požádám o radu.", scores: { teamwork: 2, growth: 2 } },
      { text: "Zkusím to znovu jinak.", scores: { persistence: 4, growth: 3 } },
      { text: "Analyzuji chybu a hledám nové řešení.", scores: { persistence: 5, thinking: 4, growth: 5 } }
    ]
  },

  {
    text: "Když vidíš člověka, který má problém, co uděláš?",
    options: [
      { text: "Nevšímám si toho.", scores: {} },
      { text: "Počkám, jestli pomoc potřebuje.", scores: { empathy: 2 } },
      { text: "Zeptám se, jestli mu můžu pomoct.", scores: { empathy: 4, teamwork: 3 } },
      { text: "Snažím se problém vyřešit společně s ním.", scores: { empathy: 4, teamwork: 4, practicality: 2 } },
      { text: "Pomůžu mu a zároveň se snažím pochopit, proč problém vznikl.", scores: { empathy: 5, teamwork: 4, thinking: 3, growth: 3 } }
    ]
  },

  {
    text: "Když máš důležitý cíl, jak postupuješ?",
    options: [
      { text: "Začnu, ale často nedokončím.", scores: { discipline: 1 } },
      { text: "Čekám na správnou náladu.", scores: { discipline: 1 } },
      { text: "Udělám si jednoduchý plán.", scores: { discipline: 3, practicality: 2 } },
      { text: "Rozdělím cíl na menší kroky.", scores: { discipline: 4, practicality: 4 } },
      { text: "Naplánuji kroky, termíny a průběžně kontroluji výsledek.", scores: { discipline: 5, practicality: 5, persistence: 3 } }
    ]
  },

  {
    text: "Když máš málo peněz nebo prostředků, jak reaguješ?",
    options: [
      { text: "Nevím, co dělat.", scores: {} },
      { text: "Snažím se najít někoho, kdo poradí.", scores: { teamwork: 2 } },
      { text: "Hledám levnější variantu.", scores: { practicality: 3 } },
      { text: "Vymyslím jiné řešení.", scores: { creativity: 4, practicality: 4 } },
      { text: "Najdu několik možností a porovnám jejich výhody a rizika.", scores: { thinking: 4, creativity: 4, practicality: 5 } }
    ]
  },

  {
    text: "Jak reaguješ na kritiku?",
    options: [
      { text: "Beru ji osobně.", scores: {} },
      { text: "Je pro mě těžké ji přijmout.", scores: { growth: 1 } },
      { text: "Poslechnu si ji.", scores: { growth: 2 } },
      { text: "Zamyslím se, jestli má druhý člověk pravdu.", scores: { thinking: 3, growth: 4 } },
      { text: "Snažím se z ní zjistit, co můžu příště udělat lépe.", scores: { thinking: 4, growth: 5 } }
    ]
  },

  {
    text: "Když pracuješ v týmu, jaká role ti nejvíce vyhovuje?",
    options: [
      { text: "Raději pracuji sám.", scores: { practicality: 1 } },
      { text: "Dělám úkol, který mi někdo zadá.", scores: { teamwork: 2 } },
      { text: "Pomáhám ostatním.", scores: { teamwork: 4, empathy: 3 } },
      { text: "Přicházím s nápady.", scores: { teamwork: 3, creativity: 4 } },
      { text: "Pomáhám týmu najít nejlepší cestu k cíli.", scores: { teamwork: 5, thinking: 4, practicality: 3 } }
    ]
  },

  {
    text: "Když máš volný čas, co tě nejčastěji láká?",
    options: [
      { text: "Odpočinek.", scores: {} },
      { text: "Zábava.", scores: { growth: 1 } },
      { text: "Něco nového se naučit.", scores: { growth: 4 } },
      { text: "Něco vytvořit.", scores: { creativity: 4, practicality: 3 } },
      { text: "Vymyslet nebo vytvořit něco, co jsem ještě nikdy nezkusil.", scores: { creativity: 5, growth: 4 } }
    ]
  },

  {
    text: "Když se musíš rychle rozhodnout, co uděláš?",
    options: [
      { text: "Rozhodnutí raději odložím.", scores: {} },
      { text: "Vyberu první možnost.", scores: { practicality: 1 } },
      { text: "Zvážím hlavní výhody a nevýhody.", scores: { thinking: 3 } },
      { text: "Vyberu možnost s nejlepším poměrem rizika a výsledku.", scores: { thinking: 4, practicality: 4 } },
      { text: "Rychle zjistím klíčové informace a potom rozhodnu.", scores: { thinking: 5, practicality: 4, discipline: 3 } }
    ]
  }
];];
    const card = document.querySelector(".card");

    let buttons = "";

    question.options.forEach((option, index) => {
      buttons += `
        <button onclick="answer(${index + 1})">
          ${option}
        </button>
      `;
    });

    card.innerHTML = `
      <h1>Otázka ${currentQuestion + 1} / ${questions.length}</h1>

      <p>${question.text}</p>

      ${buttons}
    `;
  }

  function answer(value) {function answer(value) {
  const question = questions[currentQuestion];
  const selectedOption = question.options[value - 1];

  answers.push(selectedOption.scores);

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
  }
    } else {
      showResult();
    }
  }

  function showResult() {
  const card = document.querySelector(".card");

  const scores = {
    thinking: 0,
    creativity: 0,
    persistence: 0,
    empathy: 0,
    teamwork: 0,
    discipline: 0,
    practicality: 0,
    growth: 0
  };

  answers.forEach(answer => {
    Object.keys(answer).forEach(area => {
      scores[area] += answer[area];
    });
  });

  const names = {
    thinking: "🧠 Myšlení",
    creativity: "💡 Kreativita",
    persistence: "💪 Vytrvalost",
    empathy: "❤️ Empatie",
    teamwork: "🤝 Spolupráce",
    discipline: "🎯 Disciplína",
    practicality: "🛠️ Praktičnost",
    growth: "🌱 Růst"
  };

  let result = "";

  Object.keys(scores).forEach(area => {
    result += `
      <p>
        <strong>${names[area]}</strong><br>
        ${scores[area]} bodů
      </p>
    `;
  });

  card.innerHTML = `
    <h1>Tvoje mapa 🪽</h1>

    <p>
      Toto je první experimentální profil.
      Neurčuje hodnotu člověka.
    </p>

    ${result}

    <button onclick="location.reload()">
      ZAČÍT ZNOVU
    </button>
  `;
}

    const total =
      answers.reduce((sum, value) => sum + value, 0);

    const average =
      Math.round((total / answers.length) * 20);

    card.innerHTML = `
      <h1>První část dokončena 🪽</h1>

      <p>
        Tvoje první skóre Human Indexu:
      </p>

      <h1>${average} / 100</h1>

      <p>
        Toto zatím není hodnocení člověka.
        Je to pouze první experimentální výsledek.
      </p>

      <button onclick="location.reload()">
        ZAČÍT ZNOVU
      </button>
    `;
  }
      </script>
</body>
</html>
