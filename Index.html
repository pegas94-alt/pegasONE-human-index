<body>

  <div class="container">

    <h1>LIFE:UP</h1>
<p>Každý den o krok výš. Malé kroky, skutečný pokrok.</p>
    <p class="subtitle">
      Každý den o krok výš.
    </p>

    <div class="card">
      <h2>Tvůj pokrok</h2>

      <div class="score" id="score">0</div>

      <p>UP bodů</p>
    </div>

    <div class="card">
      <h2>Dnešní krok</h2>

      <button onclick="addPoint()">
        + Přidat pokrok
      </button>
    </div>

  </div>

  <script>
    let score = 0;

    function addPoint() {
      score++;
      document.getElementById("score").textContent = score;
    }
  </script>
